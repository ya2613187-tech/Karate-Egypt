╔══ خطوات الإعداد (3 دقائق) ═══════════════════════════════════════════
1) console.firebase.google.com ← أنشئ مشروعاً ← Build ← Authentication ← Get started ← فعّل Email/Password.
2) Build ← Firestore Database ← Create database. ثم Project settings ← Your apps ← أيقونة </> (Web) ← انسخ firebaseConfig
   وضعه في مكانه أول السكربت أدناه (هذه المفاتيح عامة بطبيعتها؛ الحماية الحقيقية في القواعد).
3) Firestore ← تبويب Rules ← احذف المحتوى والصق القواعد التالية ← Publish.
4) أول مسؤول: سجّل حساباً من التطبيق، ثم من Firestore Console افتح users/{uid} وغيّر role إلى admin و status إلى approved.
   (لا يمكن لأي مستخدم ترقية نفسه: القواعد تمنع ذلك.)
5) التصنيف العالمي: استورد/أضف وثائق في مجموعة wkfRank من الـ Console أو سكربت Admin SDK/Cloud Function يقرأ من WKF
   (الحقول: n, c, cat, p, g, ts). القواعد تمنع الكتابة عليها من التطبيق نهائياً حتى للمسؤول.
6) Authentication ← Settings ← Authorized domains: أضف نطاق استضافتك. شغّل الملف من Firebase Hosting أو أي HTTPS.

FIRESTORE SECURITY RULES (انسخ كما هي):

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function hasProfile() { return signedIn() && exists(/databases/$(database)/documents/users/$(request.auth.uid)); }
    function profile() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data; }
    function isAdmin() { return hasProfile() && profile().role == 'admin'; }
    function isApproved() { return hasProfile() && profile().status == 'approved'; }

    match /users/{uid} {
      allow get: if signedIn() && (request.auth.uid == uid || isAdmin());
      allow list: if isAdmin();
      allow create: if signedIn() && request.auth.uid == uid
        && request.resource.data.role == 'player'
        && request.resource.data.status == 'pending'
        && request.resource.data.email == request.auth.token.email
        && request.resource.data.keys().hasOnly(['name','email','club','belt','disc','no','role','status','createdAt']);
      allow update: if isAdmin()
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status','decidedAt']);
      allow delete: if false;
    }
    match /tournaments/{id} { allow read: if true; allow write: if isAdmin(); }
    match /news/{id}        { allow read: if true; allow write: if isAdmin(); }
    match /results/{id}     { allow read: if true; allow write: if isAdmin(); }
    match /localRank/{id}   { allow read: if true; allow write: if isAdmin(); }
    match /wkfRank/{id}     { allow read: if true; allow write: if false; }
    match /registrations/{id} {
      allow create: if isApproved() && request.resource.data.uid == request.auth.uid;
      allow read: if isAdmin() || (signedIn() && resource.data.uid == request.auth.uid);
      allow update, delete: if false;
    }
    match /{document=**} { allow read, write: if false; }
  }
}

function addNews(t,b,g){return col('news').add({t,b,tg:g,dt:'الآن',ts:Date.now()})}
function saveN(){if(!need())return;if(!v('n1')||!v('n2'))return toast('اكتب العنوان والتفاصيل');W(addNews(v('n1'),v('n2'),v('n3')),'تم نشر الخبر')}
function fR(){if(!need())return;sheet(`<div class="t">رفع نتيجة</div><label>البطولة<select id="x0">${S.R.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}<option value="new">+ بطولة جديدة</option></select></label>
<label>اسم البطولة الجديدة (اختياري)<input id="x5"></label><label>الفئة<select id="x1">${[...CATS,...PCATS].map(c=>`<option>${c}</option>`).join('')}</select></label>
<label>المركز الأول<input id="x2" placeholder="الاسم — النادي"></label><label>المركز الثاني<input id="x3"></label><label>المركز الثالث<input id="x4"></label><button class="btn b" style="margin-top:16px" onclick="saveR()">نشر النتيجة</button>`)}
function putR(id,name,c,w){const r=S.R.find(x=>x.id===id||x.name===name);
 return r?col('results').doc(r.id).update({rows:[{c,w},...(r.rows||[])]}):col('results').add({name:name||'بطولة جديدة',date:'ديسمبر 2026',rows:[{c,w}],ts:Date.now()})}
function saveR(){if(!need())return;const w=[v('x2'),v('x3'),v('x4')];if(w.some(x=>!x))return toast('أدخل المراكز الثلاثة');
 const id=v('x0'),nm=id==='new'?v('x5'):(S.R.find(r=>r.id===id)||{}).name;W(putR(id==='new'?'':id,nm,v('x1'),w),'تم رفع النتيجة')}
function fK(){if(!need())return;sheet(`<div class="t">إضافة لاعب للرانك المحلي</div><label>الاسم<input id="k1"></label><label>النادي<input id="k2"></label><label>الفئة<select id="k3">${[...CATS,...PCATS].map(c=>`<option>${c}</option>`).join('')}</select></label><label>النقاط<input id="k4" type="number"></label><button class="btn b" style="margin-top:16px" onclick="saveK()">حفظ في الرانك</button>`)}
function putK(n,c,cat,pt){const x=S.PL.find(q=>q.n===n&&q.cat===cat);
 return x?col('localRank').doc(x.id).update({p:pt,c:c||x.c}):col('localRank').add({n,c,cat,p:pt,g:PCATS.includes(cat)?'ذوي الهمم':'عام',ts:Date.now()})}
function saveK(){if(!need())return;const pt=parseInt(v('k4'));if(!v('k1')||isNaN(pt))return toast('أدخل الاسم والنقاط');W(putK(v('k1'),v('k2'),v('k3'),pt),'تمت الإضافة للرانك')}
function fP(id){if(!need())return;const p=S.PL.find(x=>x.id===id);if(!p)return;sheet(`<div class="t">تعديل نقاط ${esc(p.n)}</div><label>النقاط<input id="p1" type="number" value="${p.p}"></label><button class="btn b" style="margin-top:16px" onclick="saveP('${id}')">حفظ النقاط</button>`)}
function saveP(id){if(!need())return;const val=parseInt(v('p1'));if(isNaN(val))return toast('أدخل رقماً صحيحاً');W(col('localRank').doc(id).update({p:val}),'تم تحديث النقاط')}
function seedAll(){if(!need())return;const b=db.batch(),n=Date.now();
 SEED.T.forEach((x,i)=>{const {id,...r}=x;b.set(col('tournaments').doc(),{...r,ts:n-i})});
 SEED.N.forEach((x,i)=>{const {id,...r}=x;b.set(col('news').doc(),{...r,ts:n-i})});
 SEED.R.forEach((x,i)=>{const {id,...r}=x;b.set(col('results').doc(),{...r,ts:n-i})});
 SEED.P.filter(p=>p.s==='محلي').forEach((p,i)=>{b.set(col('localRank').doc(),{n:p.n,c:p.c,cat:p.cat,p:p.p,g:p.g||'عام',ts:n-i})});
 W(b.commit(),'تم تحميل البيانات التجريبية')}
/* ---- تسجيل اللاعب في بطولة (لاعب معتمد فقط) ---- */
function fReg(id){const t=S.T.find(x=>x.id===id);
 if(S.role==='guest')return sheet(`<div class="t">سجّل دخولك أولاً</div><p class="m" style="margin:8px 0 16px">التسجيل في البطولات متاح للاعبين المعتمدين فقط.</p><button class="btn b" onclick="logout()">تسجيل الدخول / إنشاء حساب</button>`);
 if(S.role==='pending')return sheet(`<div class="t">⏳ حسابك قيد المراجعة</div><p class="m" style="margin:8px 0">سيُفعَّل التسجيل في البطولات بعد اعتماد المسؤول لحسابك.</p><button class="btn b" onclick="closeS()">حسناً</button>`);
 if(!isP()||!t)return;const m=S.me;
 sheet(`<div class="t">التسجيل في ${esc(t.name)}</div><label>الاسم<input id="r1" value="${esc(m.name)}"></label><label>النادي<input id="r2" value="${esc(m.club)}"></label>
<label>الحزام<select id="r3">${Object.keys(BELTS).map(b=>`<option ${b===m.belt?'selected':''}>${b}</option>`).join('')}</select></label>
<div class="row"><label style="flex:1">السن<input id="r4" type="number"></label><label style="flex:1">التخصص<select id="r5"><option ${t.type==='كاتا'?'selected':''}>كاتا</option><option ${t.type==='كوميتيه'?'selected':''}>كوميتيه</option></select></label></div>
<button class="btn b" style="margin-top:16px" onclick="saveReg('${id}')">تأكيد التسجيل</button>`)}
function saveReg(id){const t=S.T.find(x=>x.id===id);if(!isP()||!t||!v('r1')||!v('r2')||!v('r4'))return toast('أكمل البيانات');
 W(col('registrations').add({uid:auth.currentUser.uid,tid:id,tname:t.name,name:v('r1'),club:v('r2'),belt:v('r3'),age:Number(v('r4')),disc:v('r5'),ts:Date.now()}),'تم تسجيلك في البطولة')}
/* ---- الإضافة اليدوية أو المسح الضوئي (محاكاة OCR) ---- */
const AL={n:'إضافة خبر',r:'رفع نتيجة',k:'إضافة للرانك المحلي'};
function addMenu(k){if(!need())return;sheet(`<div class="t">${AL[k]}</div><p class="m" style="margin:4px 0 14px">اختر طريقة الإدخال</p>
<button class="opt" onclick="manual('${k}')"><b>✍️</b><span>إدخال يدوي<small>املأ البيانات بنفسك</small></span></button>
<button class="opt" onclick="fScan('${k}')"><b>📷</b><span>مسح ضوئي Scan<small>ارفع صورة كشف أو ورقة وتُستخرج البيانات تلقائياً</small></span></button>`)}
function manual(k){k==='n'?fN():k==='r'?fR():fK()}
const SD={n:{t:'اللجنة الفنية تعلن موعد معسكر المنتخب الوطني',g:'الاتحاد',b:'أعلنت اللجنة الفنية انطلاق معسكر المنتخب الوطني للكاراتيه بمدينة 6 أكتوبر خلال الأسبوع الأخير من ديسمبر، استعداداً لبطولة أفريقيا المفتوحة.'},
r:{name:'بطولة الجمهورية للناشئين 2026',c:CATS[5],w:['آدم وليد — نادي الأهلي','يحيى هشام — نادي الزمالك','مالك رامي — نادي الشمس']},
k:{c:CATS[2],rows:[['عمر خالد','نادي الجزيرة',3120],['مصطفى نبيل','نادي الأهلي',2680],['باسل ياسر','نادي الجيش',2210],['زين محمد','نادي سموحة',1940]]}};
const paperSvg=()=>`<svg viewBox="0 0 300 170"><rect width="300" height="170" fill="#fff"/><rect x="20" y="14" width="260" height="14" fill="#0F172A"/><rect x="90" y="36" width="120" height="6" fill="#B91C1C"/>${[0,1,2,3,4].map(i=>`<rect x="20" y="${58+i*20}" width="260" height="1.5" fill="#CBD5E1"/><rect x="26" y="${63+i*20}" width="${90+i*8}" height="5" fill="#94A3B8"/><rect x="190" y="${63+i*20}" width="50" height="5" fill="#94A3B8"/>`).join('')}</svg>`;
function fScan(k){if(!need())return;sheet(`<div class="t">مسح ضوئي — ${AL[k]}</div><p class="m" style="margin:4px 0 12px">ارفع صورة الكشف أو الورقة، أو جرّب كشفاً تجريبياً.</p>
<div id="scT"><label class="dz" for="fi">${ic(I.up,28)}<b>ارفع صورة الكشف</b><span class="m">JPG أو PNG</span></label><input id="fi" type="file" accept="image/*" hidden onchange="pickScan('${k}',this)"><button class="btn o b" onclick="runScan('${k}','')">جرّب بكشف تجريبي</button></div><div id="sc"></div>`)}
function pickScan(k,i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>runScan(k,r.result);r.readAsDataURL(f)}
function scanForm(k){const d=SD[k],cs=[...CATS,...PCATS].map(c=>`<option ${c===(d.c||'')?'selected':''}>${c}</option>`).join('');
 if(k==='n')return `<label>العنوان<input id="s1" value="${esc(d.t)}"></label><label>التصنيف<select id="s2">${['الاتحاد','بطولات','قرارات'].map(x=>`<option ${x===d.g?'selected':''}>${x}</option>`).join('')}</select></label><label>التفاصيل<textarea id="s3" rows="5">${esc(d.b)}</textarea></label>`;
 if(k==='r')return `<label>البطولة<input id="s1" value="${esc(d.name)}"></label><label>الفئة<select id="s2">${cs}</select></label>${d.w.map((w,i)=>`<label>المركز ${['الأول','الثاني','الثالث'][i]}<input id="s${i+3}" value="${esc(w)}"></label>`).join('')}`;
 return `<label>الفئة<select id="s0">${cs}</select></label><div class="m" style="margin-top:10px">الاسم · النادي · النقاط</div>${d.rows.map((r,i)=>`<div class="rin"><input id="s${i}a" value="${esc(r[0])}"><input id="s${i}b" value="${esc(r[1])}"><input id="s${i}c" type="number" value="${r[2]}"></div>`).join('')}`}
function runScan(k,src){if(!need())return;document.getElementById('scT').style.display='none';
 document.getElementById('sc').innerHTML=`<div class="paper">${src?`<img src="${src}" alt="">`:paperSvg()}<i class="laser"></i></div><div class="m" style="text-align:center">جارٍ قراءة الورقة واستخراج البيانات…</div>`;
 setTimeout(()=>{const e=document.getElementById('sc');if(!e)return;e.innerHTML=`<div class="paper sm">${src?`<img src="${src}" alt="">`:paperSvg()}</div><div class="okb">✓ تم استخراج البيانات تلقائياً — راجعها وعدّل أي خانة قبل النشر</div>${scanForm(k)}<button class="btn b" onclick="pubScan('${k}')">اعتماد ونشر</button>`},1900)}
function pubScan(k){if(!need())return;
 if(k==='n'){if(!v('s1')||!v('s3'))return toast('أكمل العنوان والتفاصيل');S.tab='n';return W(addNews(v('s1'),v('s3'),v('s2')),'تم الاعتماد والنشر')}
 if(k==='r'){const w=[v('s3'),v('s4'),v('s5')];if(!v('s1')||w.some(x=>!x))return toast('أكمل بيانات النتيجة');S.tab='r';return W(putR('',v('s1'),v('s2'),w),'تم الاعتماد والنشر')}
 const ps=[];for(let i=0;i<4;i++){const pt=parseInt(v('s'+i+'c'));if(v('s'+i+'a')&&!isNaN(pt))ps.push(putK(v('s'+i+'a'),v('s'+i+'b'),v('s0'),pt))}
 S.tab='k';S.scope='محلي';S.grp=PCATS.includes(v('s0'))?'ذوي الهمم':'عام';S.cat='الكل';W(Promise.all(ps),'تم الاعتماد والنشر')}
function render(){const au=document.getElementById('auth');
 if(!S.auth){au.style.display='block';au.innerHTML=authV();return}
 au.style.display='none';document.getElementById('lg').innerHTML=logo(34);
 document.getElementById('ttl').textContent=TABS.find(x=>x[0]===S.tab)[1];
 const rb=document.getElementById('rb');rb.textContent=RL[S.role];rb.className='badge '+S.role;
 const pn=isA()?S.U.filter(a=>a.status==='pending').length:0;
 document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')"><span class="ni"><svg viewBox="0 0 24 24">${IC[k]}</svg>${k==='a'&&pn?`<b class="dot">${pn}</b>`:''}</span>${l}</button>`).join('');
 document.getElementById('main').innerHTML=({t:vT,n:vN,r:vR,k:vK,a:vA})[S.tab]();
 const f=document.getElementById('fab'),B={t:['ارفع بطولة',fT],n:['إضافة خبر',()=>addMenu('n')],r:['رفع نتيجة',()=>addMenu('r')],k:S.scope==='محلي'?['إضافة للرانك',()=>addMenu('k')]:null}[S.tab];
 if(isA()&&B){f.style.display='flex';f.innerHTML=ic(I.plus,22)+'<span>'+B[0]+'</span>';f.onclick=()=>B[1]()}else f.style.display='none'}
if(CONFIGURED){firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();listen();startAuth()}else S.boot=false;
render();
</script>
</body>
</html>
